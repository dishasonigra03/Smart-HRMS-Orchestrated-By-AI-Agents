name: Smart HRMS CI Verification Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-platform:
    name: Code Integrity & Platform Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Backend Python Syntax & Integrity
        run: |
          python -m compileall backend/
          python -m compileall run_backend.py
          echo "✅ All backend Python modules validated with zero syntax errors."

      - name: Verify Project Configuration & Manifests
        run: |
          test -f pyproject.toml && echo "✅ pyproject.toml present"
          test -f .env.example && echo "✅ .env.example present"
          test -f README.md && echo "✅ README.md present"
          test -f frontend/package.json && echo "✅ Enterprise frontend present"
          test -f employees/package.json && echo "✅ Employee portal present"
          test -f ceo_mobile_chat_app/package.json && echo "✅ CEO mobile chat app present"

      - name: CI Suite Status
        run: |
          echo "=========================================================="
          echo "🎉 Smart HRMS Orchestrated By AI Agents - CI PASSED!"
          echo "Author: Disha Sonigra"
          echo "=========================================================="
